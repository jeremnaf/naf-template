apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: naftiko-capability-template
  title: Naftiko Capability
  description: >
    Create a new capability component by choosing what you want to expose from
    MCP, REST, or Agent Skills. The corresponding configuration file
    is then customized and pushed to GitHub.
  tags:
    - naftiko
    - capability
spec:
  owner: user:guest
  type: service

  # ──────────────────────────────────────────────────
  # Parameters entered by the user in the wizard
  # ──────────────────────────────────────────────────
  parameters:
    - title: Capability Information
      required:
        - name
        - empty
      properties:
        name:
          title: Name
          type: string
          description: Name of your capability
          ui:autofocus: true
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 2
          maxLength: 64

        empty:
          title: Tick to create an empty capability configuration skeleton
          type: boolean
          default: false
          ui:widget: checkbox

      dependencies:
        empty:
          oneOf:
            - properties:
                empty:
                  enum: [true]
            - properties:
                empty:
                  enum: [false]
                exposes:
                  title: Exposes
                  type: array
                  description: Select one or more exposes
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - MCP
                      - REST
                      - Agent Skills
                  ui:widget: checkboxes
              required:
                - exposes

    - title: API consumption
      properties:
        consumedApis:
          title: Consumed APIs
          type: array
          description: Select the APIs this capability will consume from the catalog
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: API
            defaultKind: API
          items:
            type: string

    - title: GitHub repository configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Target GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # ──────────────────────────────────────────────────
  # Execution steps of scaffolder
  # ──────────────────────────────────────────────────
  steps:
    - id: fetch-consumed-apis
      name: Fetch consumed API entities from catalog
      if: ${{ (parameters.consumedApis | length) > 0 }}
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.consumedApis }}

    - id: warn-missing-openapi
      name: "Warn — no OpenAPI definition for ${{ each.value }}"
      each: ${{ parameters.consumedApis }}
      if: ${{ (steps['fetch-consumed-apis'].output.entities[each.index].spec.type | default('')) !== 'openapi' }}
      action: debug:log
      input:
        message: >
          WARNING: '${{ each.value }}' is not of type 'openapi'
          (actual type: '${{ steps['fetch-consumed-apis'].output.entities[each.index].spec.type | default('undefined') }}').
          No OpenAPI definition will be available for this API in the capability configuration.

    - id: log-consumed-openapis
      name: List retrieved OpenAPI definitions
      if: ${{ (parameters.consumedApis | length) > 0 }}
      action: debug:log
      input:
        message: >
          OpenAPI definitions retrieved (${{ steps['fetch-consumed-apis'].output.entities | length }} API(s)):
          ${{ steps['fetch-consumed-apis'].output.entities
            | selectattr('spec.type', 'equalto', 'openapi')
            | map(attribute='metadata.name')
            | list
            | join(', ')
            | default('none') }}

    - id: fetch-skeleton
      name: Fetch skeleton capability files
      action: fetch:template
      input:
        url: ./skeletons/capabilities
        values:
          name: ${{ parameters.name }}
          empty: ${{ parameters.empty }}
          exposes: ${{ parameters.exposes if parameters.exposes else [] }}
          consumedOpenApis: ${{ steps['fetch-consumed-apis'].output.entities | default([]) }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    # - id: publish-github
    #  name: Publish on GitHub
    #  action: publish:github
    #  input:
    #    description: Capability ${{ parameters.name }} (${{ parameters.exposes | join(', ') }}) created via Backstage
    #    repoUrl: ${{ parameters.repoUrl }}
    #    defaultBranch: main
      
    # - id: wait
    #  name: Wait for repo readiness
    #  action: debug:wait
    #  input:
    #    seconds: 2

    # - id: register-catalog
    #  name: Register in Backstage catalog
    #  action: catalog:register
    #  input:
    #    repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
    #    catalogInfoPath: /catalog-info.yaml

  # ──────────────────────────────────────────────────
  # Result displayed to the user after creation
  # ──────────────────────────────────────────────────
  output:
    text:
      - title: Consumed OpenAPI definitions
        content: |
          ${{ steps['fetch-consumed-apis'].output.entities
            | selectattr('spec.type', 'equalto', 'openapi')
            | map(attribute='metadata.name')
            | list
            | join('\n')
            | default('No OpenAPI definition found among selected APIs.') }}
    #links:
    #  - title: View repository on GitHub
    #    url: ${{ steps['publish-github'].output.remoteUrl }}
    #  - title: Open a Pull Request
    #    url: ${{ steps['publish-github'].output.repoContentsUrl }}
    #  - title: View the capability component in the catalog
    #    icon: catalog
    #    entityRef: ${{ steps['register-catalog'].output.entityRef }}
